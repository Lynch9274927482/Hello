<style>

  h1{font-size:17px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
  .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}

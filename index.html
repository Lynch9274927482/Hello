<head>

<title>The Mechanical Advantage Hauler – Inclined Plane, Pulley &amp; Wheel-and-Axle</title>
<style>
  :root{--ink:#1b2a3a;--muted:#53647a;--accent:#0a56ff;--glass:rgba(255,255,255,.58);--edge:rgba(255,255,255,.75)}

  canvas{display:block;touch-action:none;outline:none;position:fixed;inset:0;z-index:1}

  .panel{z-index:10}
  .panel{background:var(--glass);border:1px solid var(--edge);

    box-shadow:0 12px 40px rgba(30,60,110,.18)}

  h1{font-size:17px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
  .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .row{margin-bottom:13px}
  .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
  .lab output{color:var(--accent);font-variant-numeric:tabular-nums}

    background:rgba(40,70,120,.2);outline:none;margin:6px 0}

  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;
    border:3px solid var(--accent);cursor:pointer}
  input[type=range]:focus-visible{box-shadow:0 0 0 3px rgba(10,86,255,.35)}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  #measBtn{flex:1 1 100%;background:#2b3a4f;color:#fff}
  #measBtn[aria-pressed=true]{background:#6a4cff}

  #meas.on{display:block}

  #chips::-webkit-scrollbar{display:none}

    box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none}

  #card{position:absolute;top:52px;left:10px;width:min(330px,calc(100% - 20px));display:flex;align-items:center;gap:6px;padding:4px 6px;

    -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
    box-shadow:0 4px 14px rgba(30,60,110,.18);pointer-events:auto;line-height:1.2}

  #card b{display:block;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #card .val{display:block;color:var(--accent);font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #card button{flex:none;width:30px;height:30px;padding:0;border-radius:9px;background:rgba(255,255,255,.55);color:var(--ink);font-size:18px;line-height:1}

  button:focus-visible{outline:3px solid rgba(10,86,255,.4);outline-offset:2px}
  #lockBtn{background:var(--accent);color:#fff}
  #addBtn{background:#ff7a1a;color:#fff}

  button{line-height:1.2;padding-left:6px;padding-right:6px}
  #lockBtn[aria-pressed=true]{background:#14a35c}
  .stat{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.45}
  .stat b{color:var(--ink)}
  @media (max-width:640px){

  }
  @media (prefers-reduced-motion:reduce){button{transition:none}}
